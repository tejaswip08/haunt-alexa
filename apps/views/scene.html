<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haunt scene</title>
    <!-- Fire TV fonts. Hosts that block outside resources fall back to the system serif. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
  </head>
  <body>
    <main id="scene" class="scene" data-mood="calm" data-state="waiting">
      <div id="fx" class="fx-host" aria-hidden="true"></div>
      <header class="masthead">
        <span class="brand">Haunt</span>
        <span id="progress" class="progress"></span>
        <button id="expand" class="expand" type="button" hidden aria-label="Open full screen">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z" />
          </svg>
        </button>
      </header>
      <h1 id="title" class="title"></h1>
      <article id="narration" class="narration" tabindex="0" aria-live="polite"></article>
      <p id="sounds" class="sounds"></p>
      <section id="ask" class="ask" hidden>
        <p id="question" class="question"></p>
        <div id="suggestions" class="suggestions"></div>
      </section>
      <p id="status" class="status" role="status">The story is gathering in the dark…</p>
    </main>
    <script type="module" src="/src/scene.ts"></script>
  </body>
</html>
